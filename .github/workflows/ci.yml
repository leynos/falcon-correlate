name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # 308 s is the slowest observed run, on a merge push with a cold
    # Merman cache; a warm cache finishes in about 55 s. Four times the
    # slowest seen, so a hang costs twenty minutes rather than the six
    # hours a self-hosted runner would otherwise allow.
    timeout-minutes: 20
    env:
      MERMAN_CLI_VERSION: '0.7.0'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install yaml schema validator
        run: bun install -g pajv

      - name: Install CLI tools
        run: |
          uv tool install interrogate==1.7.0
          for tool in mbake ty ruff; do uv tool install ${tool}; done
          uv tool install nixie-cli==1.1.0

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@a5765019912a8ab6882b12db049c7cde635f3a85
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run ruff
        run: make lint

      - name: Run typechecker
        run: make typecheck

      - name: Check spelling
        # `make markdownlint` carried the spelling gate as a prerequisite; the
        # Markdown lint action above replaced that step, so spelling runs on
        # its own here.
        run: make spelling

      - name: Set up Rust for Merman
        run: rustup toolchain install 1.95.0

      - name: Cache Merman
        id: merman-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/merman-cli
          key: merman-${{ runner.os }}-${{ runner.arch }}-${{ env.MERMAN_CLI_VERSION }}

      - name: Install Merman
        if: steps.merman-cache.outputs.cache-hit != 'true'
        run: cargo +1.95.0 install merman-cli --version "=${MERMAN_CLI_VERSION}" --locked

      - name: Validate Mermaid diagrams
        run: make nixie

  test:
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    # The slowest leg observed is 27 s, the 3.13 leg on a pull request
    # where it generates coverage instead of running pytest plainly. A
    # matrix job cannot give one leg a different ceiling, so this bounds
    # all three at roughly twenty times the slowest seen.
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
        # coverage-main.yml runs the whole suite under coverage on 3.13 for
        # every push to main, so a 3.13 leg here would run the same tests a
        # second time on the same commit. On a pull request the leg stays: it
        # is the one that generates coverage. Held by
        # tests/workflow_contracts/test_suite_runs_once.py.
        exclude:
          - python-version: ${{ github.event_name == 'push' && '3.13' || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install code
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: uv run pytest -v -n auto --ignore=tests/workflows

      # Coverage runs on pull requests only, and on a single matrix leg
      # (3.13). Pushes to main upload their own coverage (and advance the
      # ratchet baseline) via coverage-main.yml, so generating it here as
      # well would duplicate the work for the same commit.
      #
      # This lane measures and compares; it does not publish, and it does
      # not talk to CodeScene at all. A pull request from a fork has no
      # access to the token, and the CLI is a third party in the path of
      # every pull request: when its coverage parser broke on 2026-09-16
      # every lane in this estate carrying the check step went red on a
      # branch that had not changed. The gate that matters here is the
      # ratchet, which is local and reads a baseline this repository
      # wrote.
      - name: Generate coverage
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@22c1a57865e42ba7e2ca4f88ae49fa6f81f58013
        with:
          # Stated rather than detected. `auto` reads the manifests, and a
          # repository that acquires a Cargo.toml would silently change
          # what this lane measures and what the baseline below means.
          language: python
          output-path: coverage.xml
          format: cobertura
          # falcon-correlate's own `make test` target already runs
          # `pytest -n auto`, so the suite is xdist-clean; keep the
          # shared action's default worker count rather than forcing a
          # serial run.
          #
          # Compare changed-line coverage against the baseline written by
          # coverage-main.yml: caches saved on main are readable by every
          # pull-request run.
          with-ratchet: 'true'
          # This lane does not publish. The action archives the report it
          # generated under a step of its own, which no scanner over this
          # file's steps can see, so declining that archive is the only way
          # this boundary is observable here. `coverage-main.yml` keeps the
          # action's default and uploads what it archives.
          publish-artefact: 'false'
