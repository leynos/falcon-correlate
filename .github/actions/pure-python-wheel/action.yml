name: Build Pure Python Wheel and Sdist
description: >-
  Builds the source distribution and, from it, the pure Python wheel using uv,
  then uploads both as one artefact.
inputs:
  python-version:
    description: Python version to set up
    required: true
  out-dir:
    description: Directory to place built distributions
    required: false
    default: dist
  artifact-name:
    description: Name of the uploaded artefact
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
    - name: Build sdist and wheel
      shell: bash
      env:
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        set -euo pipefail
        uv build --out-dir "$OUT_DIR"
    - name: Upload sdist and wheel artefact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          dist/*.whl
          dist/*.tar.gz
        if-no-files-found: error
