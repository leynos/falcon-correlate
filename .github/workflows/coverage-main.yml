name: Coverage (main)

# The single place this repository talks to CodeScene. The service
# accepts an upload only for an analysed branch, so main-branch coverage
# is uploaded here on push, and no pull-request workflow carries a
# CodeScene action, a `cs-coverage` command or the access token. Pull
# requests generate coverage in ci.yml and compare it locally against the
# ratchet.
#
# That division is the point rather than a convenience. The CodeScene CLI
# is a third party, and on 2026-09-16 a floating version broke its
# cobertura parser and reddened every branch in this estate whose pull
# requests ran the check step. Confining it to one push lane means such a
# break stops a publication and not a review.
#
# This workflow also advances the coverage ratchet baseline: caches saved
# on main are readable by every pull-request run, so the baseline written
# here is the one those ratchet checks compare against.
#
# workflow_dispatch lets the upload be re-run on demand: merges
# performed by the automerge workflow's GITHUB_TOKEN do not fire
# push-event workflows at all, so automerged changes to main only pick
# up coverage via a manual dispatch.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never overlap trunk generations, and never cancel a running one. Each writes
# the ratchet baseline and uploads the report, so a cancelled run abandons
# both, and two running at once let the older commit finish last and leave
# its baseline as the one every pull request is measured against. GitHub
# keeps one pending run per group, so a newer push replaces an older pending
# one; skipping that intermediate commit is the right outcome, because the
# newest commit's baseline is the one pull requests should read.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # A literal label, not the fork fallback. This workflow triggers only
    # on push to main and workflow_dispatch, and neither event can carry a
    # fork's pull request, so a fork guard here would be a condition that
    # is always false. Coverage upload on main blocks no one's work, so it
    # runs on a GitHub-hosted runner rather than a paid Ubicloud one.
    runs-on: ubuntu-latest
    # 42 s is the slowest observed run on Ubicloud across three green runs.
    timeout-minutes: 10
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; `make test-workflow-contracts`
    # holds it to this job.
    environment: codescene
    permissions:
      contents: read
    env:
      MAKEUTIL_REVISION: '29fc5a1634ffbaa18a773eed9dff1b2838a45d9c'
      MAKEUTIL_TOOLCHAIN: 'nightly-2026-05-28'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Install code
        run: uv sync --group dev --python 3.13

      - name: Install Makefile parser
        run: |
          rustup toolchain install "${MAKEUTIL_TOOLCHAIN}" --profile minimal
          RUSTFLAGS="-Zpolonius=next" cargo +"${MAKEUTIL_TOOLCHAIN}" install \
            --git https://github.com/leynos/makeutil \
            --rev "${MAKEUTIL_REVISION}" \
            --locked \
            --force \
            makeutil

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@a0519a1476ab769ca7b8badfa794f3751213f1ea
        with:
          # The shared action exposes the xdist worker count but not its
          # distribution strategy. Run this suite serially so its
          # xdist_group fixtures cannot provision shared tools concurrently.
          pytest-workers: ''
          # The same selection the pull-request lane measures, so the
          # baseline this job writes is comparable with what the ratchet
          # checks against.
          language: python
          # The interpreter the coverage venv is built on, and part of the
          # baseline's cache key: left to the PATH it was 3.14 here and 3.12
          # on the pull-request lane, so the two never shared a baseline.
          python-version: '3.13'
          output-path: coverage.xml
          format: cobertura
          with-ratchet: 'true'
          # This job runs on a GitHub-hosted runner, whose cache store the
          # Ubicloud pull-request lane never reads, so a ratchet here could
          # not fail and a save here would never be restored. `never` skips
          # both and hands the figure to `coverage-baseline` below.
          publish-baseline: never
          baseline-artefact-name: coverage-baseline-handover
          # `publish-artefact` is deliberately left unset, so the action
          # keeps its default and archives the report this lane uploads.
          # Setting it here, as the pull-request lane does, would leave
          # CodeScene with no report to read.

      # The expression is evaluated before the shell starts, so this step
      # binds no secret and holds no shell conditional. With no
      # CS_ACCESS_TOKEN secret, as on a fork, the upload below skips.
      - name: Check for the CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data to CodeScene
        # The ref guard is load-bearing. `workflow_dispatch` can select any
        # branch or tag, and the push trigger's `branches: [main]` says
        # nothing about a dispatch, so without it a dispatch from a feature
        # branch would publish that branch's coverage as the trunk's. The
        # token goes straight to the input rather than through `env`: the
        # uploader is a composite action and hands a step's `env` to its
        # nested upload-artifact and cache steps, which have no use for it.
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@a0519a1476ab769ca7b8badfa794f3751213f1ea
        with:
          format: cobertura
          path: coverage.xml
          # Stated rather than inherited. `upload` is the action's default,
          # and the default is what separates this lane from the `check`
          # this repository no longer runs anywhere.
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
          # No checksum input. The pin above carries a CLI manifest that
          # names version 1.0.101, so the installation is deterministic
          # without one. `installer-checksum` is deprecated and rejected
          # when non-empty at this pin, and `archive-checksum` is a digest
          # of the manifest archive rather than of the installer script
          # that CODESCENE_CLI_SHA256 holds, so passing that variable to it
          # would fail every run.

  # Ratchets the figure `coverage-upload` handed over and saves the baseline
  # the Ubicloud pull-request lane restores. It runs only if the coverage job
  # passed, so the baseline never advances from a failed run, and it compiles
  # nothing. It carries no `if`: the action publishes only from a push.
  coverage-baseline:
    needs: coverage-upload
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Publish the ratchet baseline
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@a0519a1476ab769ca7b8badfa794f3751213f1ea
        with:
          artefact-name: coverage-baseline-handover
